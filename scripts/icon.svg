<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Dark theme window: paper outline keeps it visible on dark backgrounds -->
  <g transform="translate(8 8)">
    <rect width="80" height="80" rx="10" fill="#2b2119" stroke="#f2f2f2" stroke-width="2"/>
    <circle cx="13" cy="13" r="5" fill="#95171d"/>
    <circle cx="27" cy="13" r="5" fill="#cb9820"/>
    <circle cx="41" cy="13" r="5" fill="#30436a"/>
    <rect x="8" y="30" width="50" height="10" fill="#30436a"/>
    <rect x="18" y="46" width="40" height="10" fill="#95171d"/>
    <rect x="18" y="62" width="24" height="10" fill="#cb9820"/>
  </g>
  <!-- Light theme window -->
  <g transform="translate(40 40)">
    <rect width="80" height="80" rx="10" fill="#f2f2f2" stroke="#2b2119" stroke-width="2"/>
    <circle cx="13" cy="13" r="5" fill="#95171d"/>
    <circle cx="27" cy="13" r="5" fill="#cb9820"/>
    <circle cx="41" cy="13" r="5" fill="#30436a"/>
    <!-- Fold marker opening an indented block -->
    <polygon points="8,30 22,30 15,40" fill="#cb9820"/>
    <rect x="28" y="30" width="44" height="10" fill="#30436a"/>
    <rect x="38" y="46" width="34" height="10" fill="#95171d"/>
    <rect x="38" y="62" width="20" height="10" fill="#cb9820"/>
  </g>
</svg>
